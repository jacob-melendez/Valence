[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "valence"
version = "0.1.0"
description = "Privacy-preserving contextual emotion inference: the environment carries the signal, not the face."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.6",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
bench = ["torch>=2.6"]  # M3 GRU benchmark only; not needed to serve
slides = ["shap>=0.48"]  # beeswarm figures only; serving uses LightGBM pred_contrib
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["valence*"]
exclude = ["valence.narrator.venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
